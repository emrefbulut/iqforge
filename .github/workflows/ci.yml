name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    # Without torch: info/inspect/build/stats must work without this dependency.
    # Tests that need torch skip themselves, so the run should stay green.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run pytest -q
      - name: CLI must work without torch installed
        run: |
          uv run iqforge info examples/bpsk_01.sigmf-meta
          uv run iqforge build examples/ -o /tmp/ds --balance-by core:freq_lower_edge
          uv run iqforge stats /tmp/ds
          uv run iqforge audit /tmp/ds
          uv run iqforge audit examples/ --format json

  test-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev --extra torch
      - run: uv run pytest -q
      - name: Phase 4 verification
        run: |
          uv run iqforge build examples/ -o /tmp/ds --balance-by core:freq_lower_edge
          uv run iqforge train /tmp/ds --epochs 20

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Wheel must install and run in a clean environment
        run: |
          uv tool install --from dist/iqforge-*.whl iqforge
          iqforge info examples/bpsk_01.sigmf-meta
