[project]
name = "sigkit"
version = "0.1.0"
description = "SigMF kayıtlarını makine öğrenmesine hazır etiketli veri setlerine çeviren CLI aracı"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "sigmf>=1.2.1",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]

[project.scripts]
sigkit = "sigkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigkit"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
