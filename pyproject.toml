[project]
name = "iqforge"
dynamic = ["version"]
description = "Turn SDR captures (SigMF) into PyTorch-ready labelled datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emre Bulut" }]
keywords = [
    "software-defined-radio",
    "sigmf",
    "rf-machine-learning",
    "signal-processing",
    "pytorch",
    "dataset",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    # Floor raised from >=1.2.1 to the oldest release actually exercised.
    # The old floor was a claim about versions nobody here had ever run: CI
    # resolves fresh (uv.lock is not committed) and therefore tests exactly one
    # version, the newest. 1.11.1 and 1.12.0 are the two that have been.
    #
    # No upper bound, deliberately. Capping a library's dependency propagates
    # into every environment that installs it and can make a resolution
    # unsatisfiable for a conflict that does not exist yet. The API surface used
    # here is four calls -- SigMFFile(metadata=...), get_global_info,
    # get_captures, get_annotations -- all long-stable. The compensating control
    # is a test rather than a pin: tests/test_io.py fires on any unrecognised
    # sigmf release and reports whether the behaviour changed, which tells us
    # instead of silently blocking users. That is how 1.12.0 was caught.
    "sigmf>=1.11.1",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]

[project.urls]
Homepage = "https://github.com/emrefbulut/iqforge"
Repository = "https://github.com/emrefbulut/iqforge"
Issues = "https://github.com/emrefbulut/iqforge/issues"

[project.scripts]
iqforge = "iqforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth. The CLI reports __version__ and the manifest records
# it, so a static duplicate here could drift and make the tool misreport itself.
path = "src/iqforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/iqforge"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
