[project]
name = "iqforge"
version = "0.1.0"
description = "Turn SDR captures (SigMF) into PyTorch-ready labelled datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emre Bulut" }]
keywords = [
    "software-defined-radio",
    "sigmf",
    "rf-machine-learning",
    "signal-processing",
    "pytorch",
    "dataset",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "sigmf>=1.2.1",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]

[project.urls]
Homepage = "https://github.com/emrefbulut/iqforge"
Repository = "https://github.com/emrefbulut/iqforge"
Issues = "https://github.com/emrefbulut/iqforge/issues"

[project.scripts]
iqforge = "iqforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iqforge"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
