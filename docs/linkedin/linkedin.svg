<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="iqforge: SigMF to PyTorch datasets">
<title>iqforge</title>
<desc>CLI tool that converts SDR SigMF recordings into leak-safe PyTorch datasets with recording-level splits.</desc>
<rect width="1200" height="627" fill="#0a0d12"/>
<rect x="0" y="0" width="1200" height="4" fill="url(#grad)"/>
<defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#440154"/><stop offset="50%" stop-color="#35b779"/><stop offset="100%" stop-color="#fde725"/></linearGradient></defs>
<text x="48" y="58" font-family="Consolas, 'Courier New', monospace" font-size="42" font-weight="700" fill="#e8edf4" letter-spacing="2">iqforge</text>
<text x="48" y="88" font-family="Consolas, 'Courier New', monospace" font-size="17" fill="#8b97a8">Turn SDR captures into PyTorch datasets &#8212; without silent data leakage</text>
<rect x="48" y="110" width="340" height="200" rx="12" fill="#121820" stroke="#1e2836" stroke-width="1.5"/>
<text x="68" y="142" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#fde725">THE GAP</text>
<text x="68" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">TorchSig generates synthetic RF data.</text>
<text x="68" y="190" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">IQEngine inspects recordings in-browser.</text>
<text x="68" y="212" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">Nothing reliably bridges real SigMF</text>
<text x="68" y="234" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">captures to trainable PyTorch datasets.</text>
<text x="68" y="256" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#4a5568"> </text>
<text x="68" y="278" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">iqforge fills that step with explicit,</text>
<text x="68" y="300" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">tested pipeline decisions.</text>
<rect x="48" y="330" width="210" height="100" rx="10" fill="#121820" stroke="#1e2836" stroke-width="1.5"/>
<text x="64" y="358" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#35b779">SigMF input</text>
<text x="64" y="382" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">.sigmf-meta + .sigmf-data</text>
<text x="64" y="404" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">cf32_le / ci16_le / ci8</text>
<text x="64" y="426" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">memory-mapped I/O</text>
<line x1="264" y1="380" x2="264" y2="380" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/><polygon points="264,375 274,380 264,385" fill="#4a5568"/>
<rect x="280" y="330" width="210" height="100" rx="10" fill="#121820" stroke="#1e2836" stroke-width="1.5"/>
<text x="296" y="358" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#35b779">iqforge CLI</text>
<text x="296" y="382" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">info / inspect / build</text>
<text x="296" y="404" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">window + label + split</text>
<text x="296" y="426" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">shard + manifest.json</text>
<line x1="496" y1="380" x2="496" y2="380" stroke="#4a5568" stroke-width="2" stroke-linecap="round"/><polygon points="496,375 506,380 496,385" fill="#4a5568"/>
<rect x="512" y="330" width="210" height="100" rx="10" fill="#121820" stroke="#1e2836" stroke-width="1.5"/>
<text x="528" y="358" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#35b779">PyTorch output</text>
<text x="528" y="382" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">IQForgeDataset</text>
<text x="528" y="404" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">iq2ch (2 x N) tensors</text>
<text x="528" y="426" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">baseline CNN train</text>
<rect x="48" y="450" width="674" height="72" rx="10" fill="#0f1a14" stroke="#35b779" stroke-width="1.5"/>
<text x="68" y="478" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#35b779">Recording-level split guarantee</text>
<text x="68" y="502" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b97a8">Windows from the same recording always share one split. Impossible splits error out &#8212; never fall back to window-level leakage.</text>
<rect x="760" y="110" width="392" height="200" rx="12" fill="#121820" stroke="#1e2836" stroke-width="1.5"/>
<text x="780" y="142" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#31688e">TECH STACK</text>
<text x="780" y="168" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4a5568">Language:</text>
<text x="880" y="168" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b97a8">Python 3.11+</text>
<text x="780" y="194" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4a5568">Format:</text>
<text x="880" y="194" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b97a8">SigMF (sigmf-python)</text>
<text x="780" y="220" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4a5568">Numerics:</text>
<text x="880" y="220" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b97a8">NumPy, SciPy (STFT)</text>
<text x="780" y="246" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4a5568">CLI / UI:</text>
<text x="880" y="246" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b97a8">Typer, Rich (terminal spectrogram)</text>
<text x="780" y="272" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4a5568">ML:</text>
<text x="880" y="272" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b97a8">PyTorch optional [torch]</text>
<text x="780" y="298" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4a5568">Quality:</text>
<text x="880" y="298" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8b97a8">pytest, ruff, GitHub Actions CI</text>
<rect x="48" y="548" width="1104" height="52" rx="8" fill="#121820" stroke="#1e2836" stroke-width="1"/>
<text x="68" y="580" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#e8edf4">github.com/emrefbulut/iqforge</text>
<text x="420" y="580" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b97a8">MIT  &#183;  Open Source  &#183;  v0.1.0 alpha</text>
<text x="900" y="580" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#35b779">pip install coming soon  &#183;  clone + uv sync today</text>
</svg>