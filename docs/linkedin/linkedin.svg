<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-label="iqforge - Turn SDR captures into leak-safe PyTorch datasets">
  <title>iqforge</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#440154"/>
      <stop offset="35%" stop-color="#31688e"/>
      <stop offset="65%" stop-color="#35b779"/>
      <stop offset="100%" stop-color="#fde725"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Spectrogram motif -->
  <g opacity="0.85">
    <rect x="80" y="120" width="18" height="280" fill="#440154"/>
    <rect x="98" y="120" width="18" height="280" fill="#482878"/>
    <rect x="116" y="120" width="18" height="280" fill="#3e4989"/>
    <rect x="134" y="120" width="18" height="280" fill="#31688e"/>
    <rect x="152" y="120" width="18" height="280" fill="#26828e"/>
    <rect x="170" y="120" width="18" height="280" fill="#1f9e89"/>
    <rect x="188" y="120" width="18" height="280" fill="#35b779"/>
    <rect x="206" y="120" width="18" height="280" fill="#6ece58"/>
    <rect x="224" y="120" width="18" height="280" fill="#b5de2b"/>
    <rect x="242" y="120" width="18" height="280" fill="#fde725"/>
    <!-- burst bands -->
    <rect x="320" y="200" width="140" height="48" fill="#35b779" opacity="0.9"/>
    <rect x="500" y="280" width="140" height="48" fill="#31688e" opacity="0.9"/>
    <rect x="680" y="160" width="140" height="48" fill="#6ece58" opacity="0.9"/>
  </g>

  <!-- Arrow flow -->
  <path d="M860 260 L940 260 L930 250 M940 260 L930 270" stroke="#8b97a8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="960" y="180" width="160" height="160" rx="12" fill="#1a2230" stroke="#35b779" stroke-width="2"/>
  <text x="1040" y="235" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="22" fill="#35b779" font-weight="600">train</text>
  <text x="1040" y="265" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="22" fill="#35b779" font-weight="600">val</text>
  <text x="1040" y="295" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="22" fill="#35b779" font-weight="600">test</text>

  <!-- Headline -->
  <text x="80" y="480" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="72" font-weight="700" fill="#e8edf4" letter-spacing="2">iqforge</text>
  <text x="80" y="530" font-family="ui-monospace, Consolas, monospace" font-size="28" fill="#8b97a8" letter-spacing="0.5">Turn SDR captures into leak-safe PyTorch datasets</text>
  <text x="80" y="575" font-family="ui-monospace, Consolas, monospace" font-size="20" fill="#4a5568">SigMF ’ window ’ label ’ recording-level split ’ torch.utils.data.Dataset</text>

  <!-- Badge -->
  <rect x="920" y="480" width="200" height="44" rx="22" fill="#1f9e89" opacity="0.15" stroke="#35b779" stroke-width="1.5"/>
  <text x="1020" y="508" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#35b779" font-weight="600">OPEN SOURCE · MIT</text>

  <!-- GitHub -->
  <text x="1120" y="575" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#4a5568">github.com/emrefbulut/iqforge</text>
</svg>
